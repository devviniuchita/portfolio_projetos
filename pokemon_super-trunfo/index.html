<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Super Trunfo - POKÉMON</title>
    <meta
      name="description"
      content="Super Trunfo Pokémon - Escolha um atributo para batalhar e veja quem vence!"
    />
    <meta
      name="keywords"
      content="Super Trunfo, Pokémon, jogo de cartas, batalha, Card-Game"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Super Trunfo - Card Game Pokémon" />
    <meta
      property="og:description"
      content="Super Trunfo - Card Pokémon - Escolha um atributo para batalhar e veja quem vence!"
    />
    <meta property="og:site_name" content="Pokémon" />
    <meta property="og:url" content="#" />
    <meta property="og:image" content="/public/images/index.PNG" />
    <meta property="og:image:secure_url" content="#" />

    <!-- Otimização de pré-conexão e DNS-prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Pré-carregar recursos críticos -->
    <link rel="preload" href="/sounds/pokemon-theme.mp3" as="audio" />
    <link rel="preload" href="./src/App.css" as="style" />

    <!-- Estilos -->
    <link rel="stylesheet" href="./src/App.css" />
    <link rel="icon" type="image/x-icon" href="/favicons/pokeball.png" />
    <link
      rel="apple-touch-icon"
      type="image/x-icon"
      href="/favicons/pokeball.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />

    <!-- audio -->
    <audio preload="auto" id="bg-music" loop>
      <source src="/sounds/pokemon-theme.mp3" type="audio/mpeg" />
      Seu navegador não suporta áudio HTML5.
    </audio>
    <audio id="pikachu-sound" src="/sounds/pikachu.mp3" preload="auto"></audio>
    <audio
      id="legendary-sound"
      src="/sounds/legendary.mp3"
      preload="auto"
    ></audio>
    <audio
      id="pikachu-especial-sound"
      src="/sounds/pikachu-especial.mp3"
      preload="auto"
    ></audio>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
